name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cuteskillshare/vite-project/package-lock.json

      - run: npm ci
        working-directory: cuteskillshare/vite-project
      - run: npm run lint --if-present
        working-directory: cuteskillshare/vite-project
      - run: npm test --if-present
        working-directory: cuteskillshare/vite-project
      - run: npm run build --if-present
        working-directory: cuteskillshare/vite-project
