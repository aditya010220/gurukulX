name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cuteskillshare/vite-project/package-lock.json

      - name: Install dependencies
        working-directory: cuteskillshare/vite-project
        run: npm ci

      - name: Build project
        working-directory: cuteskillshare/vite-project
        run: npm run build
